name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint & Format (ruff/black/isort)
        run: |
          ruff check . --fix || true
          black --check . || true
          isort --check-only . || true

      - name: Type check (mypy)
        run: |
          mypy --ignore-missing-imports . || true

      - name: Security scan (bandit)
        run: |
          bandit -q -ll -r . || true

      - name: Run tests with coverage
        env:
          COVERAGE: 1
        run: |
          ./scripts/run_tests.sh || ./scripts/run_tests.sh

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Launch mock MCP server
        run: |
          python mcp_mock_server.py &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/health && exit 0 || sleep 1
          done
          echo "Server did not start in time" >&2
          exit 1

      - name: Run MCP error-path tests
        env:
          ENABLE_MCP_TESTS: '1'
        run: |
          ./scripts/run_tests.sh || true
          # run only MCP tests to ensure they pass
          python -m pytest -q tests/test_mcp_alignment_errors.py

  turning-point-py312:
    name: TurningPoint tests (Py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

      - name: Install dependencies (with ruptures)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TurningPoint test
        run: |
          python -m pytest -q tests/test_turning_point_fields_b8.py

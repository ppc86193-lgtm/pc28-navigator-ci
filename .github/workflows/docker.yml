name: Docker Build

on:
  push:
    branches: [ main, chore/** ]
  pull_request:

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [Dockerfile, Dockerfile.training, Dockerfile.cloud]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}


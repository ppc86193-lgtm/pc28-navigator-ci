name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Fixes'
    labels: ['bug', 'fix']
  - title: '🧰 Maintenance'
    labels: ['chore', 'deps', 'ci']
  - title: '🛡️ Security'
    labels: ['security']
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
exclude-labels: ['skip-changelog']
template: |
  ## Changes
  $CHANGES


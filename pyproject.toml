[tool.black]
line-length = 88
target-version = ["py39"]
include = '\\.(py|pyi)$'
exclude = '''
/(\n    \\.git\n  | \\.venv\n  | venv\n  | build\n  | dist\n  | __pycache__\n)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
known_first_party = ["repo_pc28"]
filter_files = true

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [
  ".git",
  "venv",
  ".venv",
  "build",
  "dist",
  "__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
